                                            <div>
                                                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">สถาบันการศึกษาปัจจุบัน</h3>
                                                <p class="text-sm font-bold text-slate-900 mt-1">{personalInfo.currentInstitute}</p>
                                                <p class="text-xs text-slate-500 mt-0.5">จังหวัดขอนแก่น</p>
                                            </div>
                                        </div>

                                        {/* Registered Address */}
                                        <div class="p-6 rounded-2xl border border-slate-200 bg-slate-50/50 flex items-start space-x-4">
                                            <div class="w-12 h-12 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center text-xl shrink-0">
                                                <i class="fa-solid fa-house-chimney"></i>
                                            </div>
                                            <div>
                                                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">ที่อยู่ตามภูมิลำเนา</h3>
                                                <p class="text-sm font-bold text-slate-900 mt-1">{personalInfo.address}</p>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {}
                    {showDeployGuide && (
                        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 md:p-8 shadow-2xl space-y-5 animate-fade-in">
                                <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center text-xl">
                                            <i class="fa-brands fa-github"></i>
                                        </div>
                                        <div>
                                            <h3 class="text-lg font-bold text-slate-900">วิธีลงเว็บไซต์บน GitHub Pages</h3>
                                            <p class="text-xs text-slate-500">เผยแพร่ Portfolio ออนไลน์ได้ฟรีตลอดชีพใน 3 ขั้นตอนง่ายๆ</p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setShowDeployGuide(false)}
                                        class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 transition"
                                    >
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div class="space-y-4 text-xs md:text-sm text-slate-700">
                                    <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200/80">
                                        <h4 class="font-bold text-slate-900 flex items-center text-sm">
                                            <span class="w-6 h-6 rounded-full bg-brand-600 text-white text-xs flex items-center justify-center mr-2 shrink-0">1</span>
                                            บันทึกไฟล์โค้ดนี้เป็น index.html
                                        </h4>
                                        <p class="text-xs text-slate-600 mt-1.5 pl-8">
                                            คัดลอกโค้ดทั้งหมดในไฟล์นี้ แล้วเซฟไว้ในเครื่องคอมพิวเตอร์ของคุณ โดยตั้งชื่อไฟล์ว่า <code class="bg-slate-200 px-1.5 py-0.5 rounded text-brand-700 font-mono">index.html</code>
                                        </p>
                                    </div>

                                    <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200/80">
                                        <h4 class="font-bold text-slate-900 flex items-center text-sm">
                                            <span class="w-6 h-6 rounded-full bg-brand-600 text-white text-xs flex items-center justify-center mr-2 shrink-0">2</span>
                                            สร้าง Repository บน GitHub
                                        </h4>
                                        <p class="text-xs text-slate-600 mt-1.5 pl-8">
                                            สมัคร/เข้าสู่ระบบ <a href="https://github.com" target="_blank" rel="noreferrer" class="text-brand-600 font-bold underline">GitHub.com</a> &rarr; กดปุ่ม <strong>New Repository</strong> &rarr; ตั้งชื่อ เช่น <code class="bg-slate-200 px-1 py-0.5 rounded font-mono">portfolio</code> &rarr; เลือก Public &rarr; กดสร้าง แล้วอัปโหลดไฟล์ <code class="bg-slate-200 px-1 py-0.5 rounded font-mono">index.html</code> ขึ้นไป
                                        </p>
                                    </div>

                                    <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200/80">
                                        <h4 class="font-bold text-slate-900 flex items-center text-sm">
                                            <span class="w-6 h-6 rounded-full bg-brand-600 text-white text-xs flex items-center justify-center mr-2 shrink-0">3</span>
                                            เปิดใช้งาน GitHub Pages
                                        </h4>
                                        <p class="text-xs text-slate-600 mt-1.5 pl-8">
                                            ไปที่เมนู <strong>Settings</strong> ใน Repository &rarr; เลือกเมนู <strong>Pages</strong> ด้านซ้าย &rarr; ตรง <strong>Branch</strong> เลือกเป็น <code class="bg-slate-200 px-1 py-0.5 rounded font-mono">main</code> แล้วกด <strong>Save</strong>
                                        </p>
                                    </div>

                                    <div class="p-4 bg-emerald-50 text-emerald-800 rounded-2xl text-xs border border-emerald-200 flex items-center space-x-2">
                                        <i class="fa-solid fa-circle-check text-lg text-emerald-600 shrink-0"></i>
                                        <span>
                                            เมื่อตั้งค่าเสร็จ รอประมาณ 1-2 นาที คุณจะได้ลิงก์เว็บไซต์ เช่น <code class="font-mono font-bold">https://username.github.io/portfolio/</code> นำไปใช้ยื่นสมัครเรียนหรือยื่นพอร์ตได้ทันที!
                                        </span>
                                    </div>
                                </div>

                                <div class="pt-2 text-right">
                                    <button 
                                        onClick={() => setShowDeployGuide(false)}
                                        class="bg-slate-900 text-white px-5 py-2.5 rounded-xl text-xs font-semibold hover:bg-slate-800 transition"
                                    >
                                        เข้าใจแล้ว / ปิดหน้าต่าง
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    <footer class="bg-white border-t border-slate-200 py-6 mt-8">
                        <div class="max-w-6xl mx-auto px-4 text-center text-xs text-slate-500 space-y-1.5">
                            <p>© {new Date().getFullYear()} กัลย์สุดา กรกัน (น้ำขิง) — Academic Portfolio</p>
                            <p class="text-[11px] text-slate-400">วิทยาลัยการสาธารณสุขสิรินธร จังหวัดขอนแก่น • Gatsby Minimal UI with Tailwind CSS</p>
                        </div>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
